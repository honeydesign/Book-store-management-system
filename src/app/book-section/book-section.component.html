<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<div class="book">
  <div class="book-section">
    <h2>Latest Books</h2>
    <div class="book-cards">
      <app-book-card *ngFor="let book of latestBooks" 
                     [bookTitle]="book.title" 
                     [bookAuthor]="book.author" 
                     [bookImage]="book.image"
                     [bookPrice]="book.price"
                     [bookRating]="book.rating">
      </app-book-card>
    </div>
  </div>
  
  <div class="book-section">
    <h2>Fiction Books</h2>
    <div class="book-cards">
      <app-book-card *ngFor="let book of fictionBooks" 
                     [bookTitle]="book.title" 
                     [bookAuthor]="book.author" 
                     [bookImage]="book.image"
                     [bookPrice]="book.price"
                     [bookRating]="book.rating">
      </app-book-card>
    </div>
  </div>
  
  <div class="book-section">
    <h2>Non-Fiction Books</h2>
    <div class="book-cards">
      <app-book-card *ngFor="let book of nonFictionBooks" 
                     [bookTitle]="book.title" 
                     [bookAuthor]="book.author" 
                     [bookImage]="book.image"
                     [bookPrice]="book.price"
                     [bookRating]="book.rating">
      </app-book-card>
    </div>
  </div>
  

</div>

<div class="products">
  <div><h2>Our Products</h2></div>
  <div class="sections">
    <div class="active"><p>ALL</p></div>
    <div class="un-active"><p>NEWEST</p></div>
    <div class="un-active"><p>TRENDING</p></div>
    <div class="un-active"><p>BEST SELLERS</p></div>
    <div class="un-active"><p>FEATURED</p></div>
  </div>
</div>

<div class="products-card">
  <div class="book-cards">
    <app-book-card *ngFor="let book of latestBooks" 
                   [bookTitle]="book.title" 
                   [bookAuthor]="book.author" 
                   [bookImage]="book.image"
                   [bookPrice]="book.price"
                   [bookRating]="book.rating">
    </app-book-card>
  </div>
  <div class="book-cards">
    <app-book-card *ngFor="let book of latestBooks" 
                   [bookTitle]="book.title" 
                   [bookAuthor]="book.author" 
                   [bookImage]="book.image"
                   [bookPrice]="book.price"
                   [bookRating]="book.rating">
    </app-book-card>
  </div>
  
  
</div>
