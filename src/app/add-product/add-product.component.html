<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<div class="admin-dashboard">
    <aside class="sidebar">
      <div class="logo">
        <img src="/assets/book logo.jpg" alt="Logo">
      </div>
      <nav class="nav-menu">
        <div class="nav-item" routerLink="/dashboard" routerLinkActive="active">
          <span class="material-icons nav-icon">dashboard</span>
          <span class="nav-text">Dashboard</span>
        </div>
        <div class="nav-item" routerLink="/orders" routerLinkActive="active">
          <span class="material-icons nav-icon">inventory</span>
          <span class="nav-text">Order Management</span>
        </div>
        <div class="nav-item" routerLink="/customers" routerLinkActive="active">
          <span class="material-icons nav-icon">people</span>
          <span class="nav-text">Customers</span>
        </div>
        <div class="nav-item active" routerLink="/transactions" routerLinkActive="active">
          <span class="material-icons nav-icon">credit_card</span>
          <span class="nav-text">Transactions</span>
        </div>
        <div class="nav-item" routerLink="/add-products" routerLinkActive="active">
          <span class="material-icons nav-icon">add_box</span>
          <span class="nav-text">Add Products</span>
        </div>
        <div class="nav-item" routerLink="/admin-role" routerLinkActive="active">
          <span class="material-icons nav-icon">admin_panel_settings</span>
          <span class="nav-text">Admin Role</span>
        </div>
        <div class="nav-item" routerLink="/settings" routerLinkActive="active">
          <span class="material-icons nav-icon">settings</span>
          <span class="nav-text">Settings</span>
        </div>
      </nav>
    </aside>
  
    <div class="main-content">
      <header class="top-bar">
        <h2>Add Products</h2>
        <div class="top-bar-right">
          <div class="search-box">
            <span class="material-icons search-icon">search</span>
            <input type="text" placeholder="Search orders...">
          </div>
          <span class="material-icons notification-icon">notifications</span>
          <img src="/assets/admin.jpg" alt="Admin" class="admin-avatar">
        </div>
      </header>

      <div class="add-product-page">
        <div class="product-main">
          <div class="product-form">
            <!-- Basic Details -->
            <section class="form-section">
              <h3>Basic Details</h3>
              <label>Product Name</label>
              <input type="text" placeholder="Enter product name">
      
              <label>Product Description</label>
              <textarea placeholder="Enter product description"></textarea>
            </section>
      
            <!-- Pricing -->
            <section class="form-section">
              <h3>Pricing</h3>
              <label>Product Price</label>
              <input type="number" placeholder="Enter price">
      
              <label>Discounted Price</label>
              <input type="number" placeholder="Enter discounted price">
      
              <label>Expiration Start Date</label>
              <input type="date">
      
              <label>Expiration End Date</label>
              <input type="date">
            </section>
      
            <!-- Inventory -->
            <section class="form-section">
              <h3>Inventory</h3>
              <label>Stock Quantity</label>
              <input type="number" placeholder="Enter stock quantity">
      
              <label>Stock Status</label>
              <select>
                <option>In Stock</option>
                <option>Out of Stock</option>
              </select>
            </section>
      
            <!-- Action Buttons -->
            <div class="form-actions">
              <button class="draft">Save to Draft</button>
              <button class="publish">Publish Product</button>
            </div>
          </div>
      
          <!-- Image Upload Container -->
          <div class="product-image-container">
            <section class="image-section">
              <h3>Upload Product Image</h3>
              <div class="main-image">
                <img src="/assets/placeholder.jpg" alt="Product" />
                <div class="image-buttons">
                  <button>Browse</button>
                  <button>Replace</button>
                </div>
              </div>
      
              <div class="sub-images">
                <img src="/assets/placeholder.jpg" alt="Image 1" />
                <img src="/assets/placeholder.jpg" alt="Image 2" />
                <div class="add-image">
                  <span>+</span>
                  <p>Add Image</p>
                </div>
              </div>
            </section>
      
            <!-- Categories -->
            <section class="form-section">
              <h3>Categories</h3>
              <label>Product Category</label>
              <select>
                <option>Select Category</option>
              </select>
      
              <label>Product Tag</label>
              <select>
                <option>Select Tag</option>
              </select>
            </section>
          </div>
        </div>
      </div>
      
</div>
